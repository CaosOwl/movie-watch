name: Update movies & deploy

on:
  schedule:
    - cron: '17 4 * * *'   # daily, ~06:17 Zürich time
  push:
    branches: [main]       # app edits + watchlist changes made from the phone
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch movie data (TMDB + IMDb/OMDb), availability, alerts
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOME_COUNTRY: CH
        run: node scripts/update.mjs

      - name: Commit data
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update movie data [skip ci]"
          git pull --rebase --autostash
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
