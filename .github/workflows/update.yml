name: Update movies & deploy

on:
  schedule:
    - cron: '17 4 * * *'   # daily, ~06:17 Zürich time
  push:
    branches: [main]       # app edits + watchlist changes made from the phone
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch movie data (TMDB + IMDb/OMDb), availability, alerts
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOME_COUNTRY: CH
        run: node scripts/update.mjs

      - name: Commit data
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          # Generated files only; data/watchlist.json is never overwritten here.
          FILES="data/movies.json data/recommendations.json data/alerts.json data/upcoming.json"
          mkdir -p /tmp/gen && for f in $FILES; do [ -f "$f" ] && cp "$f" /tmp/gen/; done
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in $FILES; do [ -f "/tmp/gen/$(basename $f)" ] && cp "/tmp/gen/$(basename $f)" "$f"; done
            git add $FILES 2>/dev/null || true
            if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
            git commit -q -m "Update movie data [skip ci]"
            if git push -q origin HEAD:main; then echo "Pushed on attempt $attempt"; exit 0; fi
            echo "Push rejected (another update landed first), retrying…"; sleep $((attempt * 3))
          done
          echo "Could not push after 5 attempts"; exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # GitHub's Pages API sometimes has hiccups; retry below
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
